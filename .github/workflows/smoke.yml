# Checks the live site end to end: health, the cached demo checklist, and one real Gemma call.
# Run it from the Actions tab after a deploy. Uses made-up form text only.
name: Smoke test live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site URL
        default: https://gdghacks-tau.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Security headers and caching
        run: |
          curl -sSI "${{ inputs.url }}/" | tee home.txt
          grep -qi '^content-security-policy:' home.txt
          grep -qi '^x-content-type-options: nosniff' home.txt
          grep -qi '^x-frame-options: deny' home.txt
          asset=$(curl -sS "${{ inputs.url }}/" | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -sSI "${{ inputs.url }}$asset" | tee asset.txt
          grep -qi 'cache-control: public, max-age=31536000, immutable' asset.txt
          curl -sSI "${{ inputs.url }}/data/buildings.json" | grep -i 'cache-control'
          curl -sS -o /dev/null -w '%{http_code}\n' "${{ inputs.url }}/tesseract/eng.traineddata.gz" | grep -q 200
          curl -sS -o /dev/null -w '%{http_code}\n' "${{ inputs.url }}/no-such-page" | grep -q 404
      - name: Rate limit under a burst from one address (informational)
        # The limiter is per serverless instance. This prints the status and instance id of nine quick calls;
        # a 429 proves the limiter, while nine different instance ids explain a run without one.
        run: |
          for i in $(seq 1 9); do
            curl -sS -o /dev/null -D - -X POST -H 'Content-Type: application/json' \
              --data '{"text":"Please bring two pay stubs and a photo ID to the leasing office by next Friday."}' \
              "${{ inputs.url }}/api/snap-text" | grep -iE '^(HTTP|x-instance|retry-after)' | tr '\n' ' '; echo
          done
      - name: Health
        run: |
          curl -fsS "${{ inputs.url }}/api/health" | tee health.json
          grep -q '"ai":true' health.json
      - name: Cached demo checklist
        run: |
          node -e '
            const text = `SAMPLE APARTMENTS RENTAL APPLICATION (DEMO ONLY)\n\nPlease return this application to the leasing office by November 14, 2026.`;
            fetch(process.argv[1] + "/api/snap-text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
              .then(async r => { const raw = await r.text(); console.log(r.status, raw.slice(0, 2000)); if (!r.ok) process.exit(1) })
          ' "${{ inputs.url }}"
      - name: Live Gemma checklist
        run: |
          node -e '
            const text = [
              "Maple Court Apartments (sample form for testing)",
              "Applications are due by December 1, 2026.",
              "Please include a $40 non-refundable application fee per adult.",
              "Bring copies of your last three pay stubs and a valid photo ID.",
              "Questions: call the leasing office at (202) 555-0142."
            ].join("\n");
            const t0 = Date.now();
            fetch(process.argv[1] + "/api/snap-text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
              .then(async r => {
                const raw = await r.text();
                console.log(r.status, (Date.now() - t0) + "ms", raw.slice(0, 3000));
                if (!r.ok || !JSON.parse(raw).items?.length) process.exit(1);
              })
          ' "${{ inputs.url }}"
