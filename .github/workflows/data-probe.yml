# Read-only look at candidate open-data sources for more buildings. Pushes probe/report.json to the data-probe branch.
name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 data/probe.py
      - name: Push the report to the data-probe branch
        run: |
          cd probe
          git init -q -b data-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Data source probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-probe
