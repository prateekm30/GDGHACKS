# Screenshots the live site on desktop and phone and saves them to the `screenshots` branch.
name: Screenshot live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site URL
        default: https://gdghacks-tau.vercel.app

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Take screenshots
        run: mkdir -p shots && node .github/scripts/screenshot.cjs "${{ inputs.url }}" shots
      - name: Intro, spotlight, and results walk-through
        run: node .github/scripts/polish-shots.cjs "${{ inputs.url }}" shots/polish
      - name: Street View audit (sample of buildings, by address)
        run: node .github/scripts/streetview-audit.cjs "${{ inputs.url }}" shots/streetview
      - name: Save to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Screenshots of ${{ inputs.url }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
